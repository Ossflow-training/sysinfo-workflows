name: Python script CI
on: push

jobs:

    mysystem_lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                python-version: '3.13'
            - name: dependencies installation
              run: pip install ifaddr psutil pylint
            - name: check lint
              run:  pylint --disable=missing-docstring script/mysystem/mysystem.py

    mysystem_run:
        runs-on: ubuntu-latest
        needs: mysystem_lint
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                python-version: '3.13'
            - name: dependencies installation
              run: pip install ifaddr psutil 
            - name: mysystem run
              run: python script/mysystem/mysystem.py

    mysystem_unit:
        runs-on: ubuntu-latest
        needs: mysystem_run
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                python-version: '3.13'
            - name: dependencies installation
              run: pip install ifaddr psutil pytest
            - name: Unit tests for mysystem.py
              continue-on-error: true
              run: pytest --junitxml=report.xml  
            - name: Rapport de tests
              if: ${{ !cancelled() }}
              uses: mikepenz/action-junit-report@v6  
              with:
                report_paths: report.xml
                detailed_summary: true
                include_passed: true    