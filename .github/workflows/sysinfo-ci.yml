name: "CI for sysinfo C project"
on: push

jobs:
    sysinfo_lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: syntax check
              run: make lint

    sysinfo_build:
        permissions:
            id-token: write
            contents: read
            attestations: write
        runs-on: ubuntu-latest
        needs:
            - sysinfo_lint
        steps:
            - uses: actions/checkout@v7
            - name: Compilation
              run: |
                mkdir bin
                make build
            - uses: actions/upload-artifact@v7
              with:
                name: sysinfo-${{ github.sha }}
                path: bin/sysinfo
            - name: Generate attestation
              uses: actions/attest-build-provenance@v4
              with:
               subject-path: 'sysinfo'
    
    sysinfo_run:
        runs-on: ubuntu-latest
        needs:
            - sysinfo_build
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v7
              with:
                name: sysinfo-${{ github.sha }}
                path: bin
            - name: run test for sysinfo
              run: |
                chmod +x bin/sysinfo
                ./bin/sysinfo